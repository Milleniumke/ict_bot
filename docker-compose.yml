version: "3.9"
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./journal.sqlite:/app/journal.sqlite
      - ./state.json:/app/state.json
      - ./adaptive.json:/app/adaptive.json
      - ./bot.log:/app/bot.log
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./journal.sqlite:/app/journal.sqlite
